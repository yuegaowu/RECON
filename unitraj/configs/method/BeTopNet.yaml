# ============================================================
# BeTopNet (Behavioral Topology) — additive braid-reasoning head on an MTR backbone
# Paper: https://arxiv.org/abs/2409.18031  (NeurIPS 2024, OpenDriveLab)
# ============================================================
# agent-centric, MTR-family input (29-dim agents, 64 intention anchors, 6 modes).
# The encoder IS the UniTraj MTR encoder (reused verbatim). The decoder adds the
# behavioral-topology reasoning head (TopoFuser/TopoDecoder + TopoAttention) that
# predicts which agents/lanes the focal agent will braid with, and uses those
# braids to drive sparse local attention + an EDA distinct-anchor classifier.
#
# Map is processed exactly like every other UniTraj model (29-dim polylines,
# 384 lines x 30 points), so NUM_INPUT_ATTR_MAP=29 (vs 9 in the original WOMD repo).
#
# Values in this file override matching config.yaml fields via OmegaConf.merge in train.py.
# Hydra command-line overrides take precedence: python train.py method=BeTopNet ...
# ============================================================

model_name: BeTopNet

# --- 1. Model architecture (shape changes may invalidate existing checkpoints) ---
CONTEXT_ENCODER:
  NAME: MTREncoder
  NUM_OF_ATTN_NEIGHBORS: 16
  NUM_INPUT_ATTR_AGENT: 29
  NUM_INPUT_ATTR_MAP: 29        # UniTraj map representation (29-dim), not the WOMD 9-dim
  NUM_CHANNEL_IN_MLP_AGENT: 256
  NUM_CHANNEL_IN_MLP_MAP: 64
  NUM_LAYER_IN_MLP_AGENT: 3
  NUM_LAYER_IN_MLP_MAP: 5
  NUM_LAYER_IN_PRE_MLP_MAP: 3
  D_MODEL: 256
  NUM_ATTN_LAYERS: 6
  NUM_ATTN_HEAD: 8
  DROPOUT_OF_ATTN: 0.1
  USE_LOCAL_ATTN: True

DECODER:
  NAME: BeTopDecoder
  NUM_MOTION_MODES: 6
  # Dataset-specific prior anchors: 64 intention points. The default path uses MTR's Waymo anchors.
  # Waymo is the primary reproduction dataset. For another dataset, set this field to 'auto'
  # or pass method.DECODER.INTENTION_POINTS_FILE=auto. train.py clusters training GT endpoints
  # with k-means and writes models/mtr/cluster_64_center_dict_<dataset>_<H>s.pkl.
  # It updates the path in this YAML and continues training. Missing files and auto/null also trigger generation.
  INTENTION_POINTS_FILE: 'models/mtr/cluster_64_center_dict_8s.pkl'
  D_MODEL: 512
  NUM_DECODER_LAYERS: 6
  NUM_ATTN_HEAD: 8
  MAP_D_MODEL: 256
  ACTOR_D_MODEL: 256
  DROPOUT_OF_ATTN: 0.1
  NUM_BASE_MAP_POLYLINES: 256
  NUM_WAYPOINT_MAP_POLYLINES: 128
  NUM_TOPO: 32                  # top-k agents kept by the agent-topology indexing
  DISTINCT_ANCHORS: True        # EDA evolving & distinct anchor selection
  END_TO_END: False             # anchor-based (full_64) variant
  LOSS_WEIGHTS: {
    'cls': 1.0,
    'reg': 1.0,
    'vel': 0.5,
    'top': 100
  }
  NMS_DIST_THRESH: 2.5

# --- 2. Training hyperparameters ---
max_epochs: 40
# BeTop uses a conditional-DETR decoder with keep_query_pos=False. After the first layer,
# query-position projections are unused and receive no gradients, which can trigger DDP reducer errors.
# Use find_unused_parameters_true, as for SMART, for both single-GPU and multi-GPU runs.
ddp_strategy: 'ddp_find_unused_parameters_true'
learning_rate: 0.0001
optimizer: AdamW
scheduler: lambdaLR
learning_rate_sched: [ 22, 24, 26, 28 ]
lr_decay: 0.5
lr_clip: 0.000001
grad_clip_norm: 1000.0
weight_decay: 0.01

# --- 3. Data loading ---
train_batch_size: 3
eval_batch_size: 3
cache_path: "${data_root}/unitraj_cache/betopnet_unified_v1"
h5_cache_format: 'unitraj_mtr_unified_v1'   # Same shared cache format and input representation as MTR.

# --- 4. Data cropping and feature masking (as in MTR: mask z_axis, retain size) ---
masked_attributes: [ 'z_axis' ]
remove_outliers: False
max_num_agents: 32
max_agent_distance: 80.0
agent_center_offset: [ 30.0, 0.0 ]
map_range: 100
max_num_roads: 384
max_points_per_lane: 30
manually_split_lane: False
point_sampled_interval: 1
num_points_each_polyline: 20
vector_break_dist_thresh: 1.0
