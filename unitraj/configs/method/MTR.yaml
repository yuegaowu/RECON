# ============================================================
# MTR (Motion TRansformer): anchor-based multimodal prediction.
# Paper: https://arxiv.org/abs/2209.13508  (NeurIPS 2022, Shi et al.)
# ============================================================
# Agent-centric input: one sample per center_object. The encoder processes agents and maps; the decoder uses
# 64 intention anchors to predict 6 candidate trajectories and confidence scores. Object size features are retained.
#
# Values in this file override matching config.yaml fields via OmegaConf.merge in train.py.
# Hydra command-line overrides take precedence: python train.py method=MTR method.train_batch_size=16 ...
# ============================================================

model_name: MTR

# --- 1. Model architecture (shape changes may invalidate existing checkpoints) ---
# Keep CONTEXT_ENCODER and MOTION_DECODER nested; MTR reads these uppercase configuration keys.
CONTEXT_ENCODER:
  NAME: MTREncoder
  NUM_OF_ATTN_NEIGHBORS: 16  # restored to original MTR paper value (was 7)
  NUM_INPUT_ATTR_AGENT: 29
  NUM_INPUT_ATTR_MAP: 29
  NUM_CHANNEL_IN_MLP_AGENT: 256
  NUM_CHANNEL_IN_MLP_MAP: 64
  NUM_LAYER_IN_MLP_AGENT: 3
  NUM_LAYER_IN_MLP_MAP: 5
  NUM_LAYER_IN_PRE_MLP_MAP: 3
  D_MODEL: 256
  NUM_ATTN_LAYERS: 6
  NUM_ATTN_HEAD: 8
  DROPOUT_OF_ATTN: 0.1
  USE_LOCAL_ATTN: True

MOTION_DECODER:
  NAME: MTRDecoder
  NUM_MOTION_MODES: 6
  INTENTION_POINTS_FILE: 'models/mtr/cluster_64_center_dict_8s.pkl'
  D_MODEL: 512
  NUM_DECODER_LAYERS: 6
  NUM_ATTN_HEAD: 8
  MAP_D_MODEL: 256
  DROPOUT_OF_ATTN: 0.1
  NUM_BASE_MAP_POLYLINES: 256
  NUM_WAYPOINT_MAP_POLYLINES: 128
  LOSS_WEIGHTS: {            # Classification, regression and velocity loss weights in the decoder configuration.
    'cls': 1.0,
    'reg': 1.0,
    'vel': 0.5
  }
  NMS_DIST_THRESH: 2.5

# --- 2. Training hyperparameters (epochs, learning rate, scheduler, decay, gradient clipping) ---
max_epochs: 32
learning_rate: 0.0001
optimizer: AdamW
scheduler: lambdaLR
learning_rate_sched: [ 22, 24, 26, 28 ]   # lambdaLR milestones; multiply the learning rate by lr_decay at each milestone.
lr_decay: 0.5             # Learning rate decay factor at each milestone.
lr_clip: 0.000001         # Minimum learning rate.
grad_clip_norm: 1000.0    # Gradient clipping norm.
weight_decay: 0.01

# --- 3. Data loading (scene files per GPU per step) ---
# Batch sizes are per GPU under DDP. Both onthefly and H5 expand each scene into all selected center_object samples.
# collate_fn flattens targets across train_batch_size scenes; config.yaml limits the targets passed to the GPU
# to max_agents_per_batch=64. The current scene batch is 3 per GPU; the target count depends on scene contents.
train_batch_size: 3
eval_batch_size: 3
cache_path: "${data_root}/unitraj_cache/mtr_unified_v1"
h5_cache_format: 'unitraj_mtr_unified_v1'

# --- 4. Data cropping and feature masking (change with care) ---
# MTR reads 29-dimensional obj_trajs. Bounding-box size at indices 3-5 helps distinguish object types.
# Mask only z_axis and retain size, overriding shared settings that also mask size.
masked_attributes: [ 'z_axis' ]
remove_outliers: False
max_num_agents: 32        # Up to 32 agents within 80 m of the shifted center, including the prediction target.
max_agent_distance: 80.0
agent_center_offset: [ 30.0, 0.0 ]
map_range: 100            # Circular map crop with a 100 m radius around the same shifted center.
max_num_roads: 384        # Up to 384 cropped map features.
max_points_per_lane: 30   # At most 30 points per feature; shorter features are padded.
manually_split_lane: False
point_sampled_interval: 1
num_points_each_polyline: 20
vector_break_dist_thresh: 1.0
